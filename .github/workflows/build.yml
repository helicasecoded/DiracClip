name: Build DiracClip (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  PIP_INDEX_URL: https://pypi.org/simple
  SENTRY_UPLOAD_SOURCEMAPS: "false"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Force LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout repo (zip parts live here)
        uses: actions/checkout@v4

      - name: Unzip all source parts into ./app
        run: |
          set -e
          mkdir -p app
          ls -la diracclip-part*.zip
          for z in diracclip-part*.zip; do
            echo "Unzipping $z"
            python -m zipfile -e "$z" app
          done
          test -f app/src-tauri/tauri.conf.json
          test -f app/scripts/build_windows_x64.sh
          echo "Source ready: $(find app -type f | wc -l) files"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Cache portable Python + ffmpeg downloads
        uses: actions/cache@v4
        with:
          path: |
            app/build/pbs-cache
            app/build/ffmpeg-cache
          key: diracclip-downloads-windows-${{ hashFiles('app/scripts/build_windows_x64.sh', 'app/scripts/lib/desktop_build_common.sh', 'app/scripts/ffmpeg-win64.env') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Build Windows installer
        working-directory: app
        run: bash scripts/build_windows_x64.sh

      - name: Collect installer
        run: |
          set -e
          mkdir -p dist
          cp app/src-tauri/target/release/bundle/nsis/*-setup.exe dist/
          ls -la dist

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: diracclip-windows-x64
          path: dist/*.exe
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.exe --clobber
          else
            gh release create "$TAG" dist/*.exe \
              --title "DiracClip $TAG" \
              --notes "Windows x64 installer. Download the -setup.exe file and run it."
          fi
