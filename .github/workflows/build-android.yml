name: Build DiracClip (Android)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. android-v1.0.0)"
        required: true
        default: "android-v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo (zip lives here)
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          set -e
          ls -la diracclip-android.zip
          mkdir -p android-app
          unzip -q diracclip-android.zip -d android-app
          test -f android-app/settings.gradle.kts
          test -f android-app/diracclip.p12
          find android-app -type f | head -30

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (already on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle -p android-app assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/app-release.apk dist/DiracClip-android.apk
          ls -la dist

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: diracclip-android
          path: dist/DiracClip-android.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/DiracClip-android.apk --clobber
          else
            gh release create "$TAG" dist/DiracClip-android.apk \
              --title "DiracClip Android $TAG" \
              --notes "Android APK. Download DiracClip-android.apk and install it."
          fi
